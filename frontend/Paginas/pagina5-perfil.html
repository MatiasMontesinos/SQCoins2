<div class="perfil-container">
  <!-- Formulario de Registro -->
  <div class="formulario-registro">
    <h2>Registro</h2>
    <form id="formRegistro">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="apellido">Apodo:</label>
      <input type="text" id="apellido" name="apellido" required />

      <label for="fechaNacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required />
      <div id="errorEdad" style="color: red; display: none; font-size: 0.9em;">
        Debes tener al menos 18 años para registrarte.
      </div>

      <label for="passwordRegistro">Contraseña:</label>
      <input type="password" id="passwordRegistro" name="passwordRegistro" required />

      <button type="submit" id="btnRegistrar">Registrar</button>
    </form>
  </div>

  <!-- Formulario de Login -->
  <div class="formulario-login" style="margin-top: 40px;">
    <h2>Iniciar sesión</h2>
    <form id="formLogin">
      <label for="nombreLogin">Nombre:</label>
      <input type="text" id="nombreLogin" name="nombreLogin" required />

      <label for="passwordLogin">Contraseña:</label>
      <input type="password" id="passwordLogin" name="passwordLogin" required />

      <button type="submit" id="btnLogin">Ingresar</button>
    </form>
  </div>
</div>

<!-- Info de usuario después del log in -->
<div id="contenidoPostLogin" style="display: none; margin-top: 20px; position: relative; max-width: 350px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 12px rgba(0,0,0,0.15); font-family: Arial, sans-serif;">
  <h2 style="text-align:center; margin-bottom: 20px;">¡Bienvenido, <span id="nombreUsuario"></span>!</h2>

  <div class="info-row">
    Apodo: <span id="apodoUsuario"></span>
  </div>
  <div class="info-row">
    Fecha de nacimiento: <span id="fechaNacimientoUsuario"></span>
  </div>
  <div class="info-row">
    Monedas totales: <span id="monedasUsuario"></span>
  </div>

  <!-- Botón Editar -->
  <button id="btnEditar" style="position: absolute; bottom: 15px; right: 15px;">Editar Apodo</button>

  <!-- Formulario de edición oculto inicialmente -->
  <div id="formEditar" style="display: none; margin-top: 20px;">
    <input type="text" id="nuevoApodo" placeholder="Nuevo apodo" />
    <button id="btnConfirmar">Confirmar</button>
    <button id="btnCancelar">Cancelar</button>
  </div>
</div>
